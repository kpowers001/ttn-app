<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTN Partner QR Codes — print sheet</title>
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', sans-serif; padding: 32px; color: #111; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p.note { color: #666; font-size: 13px; margin-bottom: 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .card {
      border: 1.5px solid #ddd; border-radius: 14px; padding: 24px;
      text-align: center; page-break-inside: avoid;
    }
    .card .qr { display: flex; justify-content: center; margin-bottom: 14px; }
    .card h2 { font-size: 17px; margin-bottom: 2px; }
    .card .addr { font-size: 12px; color: #666; margin-bottom: 8px; }
    .card .code { font-family: ui-monospace, monospace; font-size: 13px; background: #F2F2F2; border-radius: 8px; padding: 4px 10px; display: inline-block; }
    .card .brand { margin-top: 12px; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #8B1A1A; }
    @media print { body { padding: 0; } .card { border-color: #bbb; } }
  </style>
</head>
<body>
  <h1>Tuskegee Trail Network — Partner QR Codes</h1>
  <p class="note">Print this page and give each partner their code to display near the entrance or register. Students scan it in the TTN app (Scan tab) to check in. The short code under each QR works as a manual fallback.</p>
  <div class="grid" id="grid"></div>
  <script>
    const LOCATIONS = [
      ['bb-barbecue',       'B&B Barbecue',                '405 Fonville St'],
      ['house-of-stewarts', 'The New House of Stewarts',   '2801 W Martin Luther King Hwy'],
      ['airmen-museum',     'Tuskegee Airmen Museum',      '1616 Chappie James Ave, Moton Field'],
      ['carver-museum',     'G.W. Carver Museum',          '1212 W Montgomery Rd'],
      ['legacy-museum',     'Legacy Museum',               '1200 W Montgomery Rd, Kenney Hall'],
      ['farmers-market',    'Macon County Farmers Market', 'Elm St & Spring St'],
      ['shady-grove',       'Shady Grove Blueberry Patch', '690 County Road 81'],
      ['tuskegee-honey',    'Tuskegee Honey',              'Farmers Market stand'],
      ['the-shed',          'The Shed (Reptile House)',    'Address TBD'],
    ];
    const grid = document.getElementById('grid');
    for (const [id, name, addr] of LOCATIONS) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="qr" id="qr-${id}"></div><h2>${name}</h2><div class="addr">${addr}</div><span class="code">${id}</span><div class="brand">TUSKEGEE TRAIL NETWORK</div>`;
      grid.appendChild(card);
      new QRCode(document.getElementById(`qr-${id}`), { text: id, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
    }
  </script>
</body>
</html>
